<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="page">
    <div class="card">

      <div class="card-header">
        <div class="card-logo">🔑</div>
        <h1>Welcome back</h1>
        <p>Sign in to your account</p>
      </div>

      <div class="alert" id="alertBox"></div>

      <form id="loginForm" novalidate>

        <div class="form-group">
          <label for="username">Username or Email</label>
          <input
            type="text"
            id="username"
            placeholder="Your username or email"
            autocomplete="username"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="password"
              placeholder="Your password"
              autocomplete="current-password"
            />
            <button type="button" class="toggle-password" id="togglePass" aria-label="Show/hide password">👁</button>
          </div>
        </div>

        <div class="divider"></div>

        <button type="submit" class="btn btn-primary">Sign In</button>

      </form>

      <div class="card-footer">
        Don't have an account? <a href="register.html">Create one</a>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const alertBox = document.getElementById("alertBox");
    const passwordInput = document.getElementById("password");
    const togglePass = document.getElementById("togglePass");

    if (getSession()) {
      window.location.href = "dashboard.html";
    }

    togglePass.addEventListener("click", () => {
      const isText = passwordInput.type === "text";
      passwordInput.type = isText ? "password" : "text";
      togglePass.textContent = isText ? "👁" : "🙈";
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideAlert(alertBox);

      const username = document.getElementById("username").value.trim();
      const password = passwordInput.value;

      if (!username || !password) {
        showAlert(alertBox, "Please enter your username/email and password.");
        return;
      }

      const enteredHash = await hashPassword(password);
      const users = getUsers();
      const match = users.find(
        u => u.username.toLowerCase() === username.toLowerCase() && u.passwordHash === enteredHash
      );

      if (!match) {
        showAlert(alertBox, "Invalid username/email or password.");
        return;
      }

      setSession(match.username);
      window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
